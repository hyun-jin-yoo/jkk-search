# This is a basic workflow to help you get started with Actions

name: Check houses(High).

# Controls when the workflow will run
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/5 * * * *" 

permissions:
  issues: write  # This line ensures the workflow has permission to create issues
  actions: write
  contents: read

jobs:
  check-time-range:
    runs-on: ubuntu-latest
    steps:
      - name: Check time range
        run: |
          # Get the current hour in UTC
          HOUR=$(date +"%H")

          echo "HOUR:${HOUR}"
          
          # Check if outside 07:00 to 18:00 JST range (UTC 22시 ~ 09시)
          if [ $HOUR -lt 22 ] && [ $HOUR -ge 9 ]; then
            echo "Current time is outside the schedule range. Exiting..."
            exit 0
          fi
          
  call-callee:
    runs-on: ubuntu-latest
    needs: check-time-range
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Check Vacancy and Create Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -c '.[]' .github/input_parameter_high_priority.json | while read i; do
            NAME=$(echo $i | jq -r '.houseName')
            CODE=$(echo $i | jq -r '.encodedHouseName')
            KEY=$(echo $i | jq -r '.grepKey')
            URL=$(echo $i | jq -r '.homePage')
            EXCL=$(echo $i | jq -r '.grepKeyExcluded // empty')

            # 1. JKK 사이트 조회
            RES=$(curl -s -L "https://jhomes.to-kousya.or.jp/search/jkknet/service/akiyaJyokenDirect" \
              -d "redirect=true&sen_flg=1&jutaku_name=$CODE")
            RES_UTF8=$(echo "$RES" | iconv -f SHIFT_JIS -t UTF-8 2>/dev/null || echo "$RES")

            # 2. 공실 확인 시 바로 Issue 생성
            if ! echo "$RES_UTF8" | grep -q "$KEY"; then
              echo "공실 발견: $NAME"
              gh issue create \
                --title "🏠 [공실 발생] $NAME ($EXCL)" \
                --body "매물 링크: $URL"
            else
              echo "$NAME [$EXCL] 빈집 없음"
            fi
          done
